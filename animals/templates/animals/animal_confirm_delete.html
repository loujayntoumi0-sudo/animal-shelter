{% extends 'animals/base.html' %}

{% block title %}Delete {{ animal.name }}{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Delete Animal</h2>
    <div class="card" style="margin: 20px 0; background: #fff3cd;">
        <p style="font-size: 18px;">Are you sure you want to delete <strong>{{ animal.name }}</strong>?</p>
        <p>This action cannot be undone.</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'animal_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
